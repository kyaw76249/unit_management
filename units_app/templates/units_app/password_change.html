<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စကားဝှက်ပြောင်းရန်</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
    /* မျက်နှာပြင်တစ်ခုလုံးကို နေရာသေချာသတ်မှတ်ပြီး မရွေ့အောင် လုံးဝပိတ်ထားခြင်း */
    html, body {
        height: 100vh;
        overflow: hidden;
        margin: 0;
        background-color: #f8f9fa;
    }
    .container-box {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        max-width: 450px;
    }
    /* Django password help text များကို သေးငယ်စေပြီး နေရာမယူအောင် လုပ်ခြင်း */
    .helptext, .helptext ul {
        font-size: 11px !important;
        color: #6c757d;
        margin-bottom: 5px !important;
        padding-left: 15px;
    }
    .form-group p, form p {
        margin-bottom: 8px !important;
    }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark py-1 px-2" style="background_color: transparent;">
        <div class="container-fluid">
            <a href="{% url 'profile_edit' %}" class="btn btn-primary rounded-2 d-flex align-items-center justify-content-center text-white px-3 py-2" title="နောက်သို့">
                <i class="bi bi-chevron-left me-1" style="font-size: 15px;"></i>
            </a>
        </div>
    </nav>

    <main class="container d-flex align-items-center justify-content-center flex-grow-1" style="min-height: 100vh">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-8 col-lg-6 container-box px-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-3 p-md-4">
                        <h3 class="mb-3 text-center fs-4">Change Password</h3>

                        <form method="POST">
                            {% csrf_token %}
                            {{ form.as_p }}

                            <div class="d-grid mt-3">
                                <button type="submit" class="btn btn-primary py-2">Ok</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
