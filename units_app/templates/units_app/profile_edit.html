<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Military Unit System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
    /* မျက်နှာပြင်တစ်ခုလုံးကို နေရာသေချာသတ်မှတ်ပြီး မရွေ့အောင် ထိန်းချုပ်ခြင်း */
    html, body {
        height: 100vh;
        overflow: hidden; /* အောက်သို့ scroll ဆွဲ၍မရအောင် ပိတ်ထားခြင်း */
        margin: 0;
    }
    .fixed-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        max-width: 500px; /* လိုအပ်သော Form အရွယ်အစား */
    }
</style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-dark  py-1 px-2" style="background_color: transparent;">
        <div class="container-fluid">
            <a href="{% url 'unit_list' %}" class="btn btn-primary rounded-2 d-flex align-items-center justify-content-center text-white px-3 py-2" title="နောက်သို">
            <i class="bi bi-chevron-left me-1" style="font-size: 15px;"></i>
        </a>
            <!-- အလယ်တည့်တည့်တွင် ရှိမည့် Profile စာသား -->

        </div>
    </nav>
    <!-- Main Content -->
    <main class="container d-flex align-items-center justify-content-center  flex-grow-1" style="min-height: 100vh" >
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-6 col-lg-5">
               <div class="fixed-container px-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 text-center">
                         <h2 class="mb-4 text-center">User Account</h2>
                        <!-- 👤 ဝင်ထားတဲ့ အကောင့်ပိုင်ရှင် (Username) ကို ကြီးမားစွာပြသခြင်း -->
                        <div class="mb-4">
                            <i class="bi bi-person-circle text-primary" style="font-size: 64px;"></i>
                            <h4 class="mt-2 mb-0 fw-bold text-dark">{{ request.user.username }}</h4>
                            <p class="text-muted small"></p>
                        </div>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-success alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <!-- ၁။ Username ပြောင်းရန် Form -->

                        <form method="POST" class="text-start mb-4">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold"> Change Username </label>
                                <input type="text" name="username" value="{{ request.user.username }}" class="form-control" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary py-2">OK</button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <!-- ၂။ Password ပြောင်းရန် ခလုတ် -->
                        <div class="d-grid mb-3">
                            <a href="{% url 'password_change' %}" class="btn btn-outline-secondary py-2">
                                <i class="bi bi-key me-1"></i> Change Password
                            </a>
                        </div>

                        <!-- ၃။ Logout (ထွက်ရန်) ခလုတ် -->
                        <div class="d-grid">
                            <form action="{% url 'logout' %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-primary w-100 py-2" >
                                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                                </button>
                            </form>
                        </div>
                        </div>
                </div>
            </div>
        </div>
            </div>
    </main>




    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
