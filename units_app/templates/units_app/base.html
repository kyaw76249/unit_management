<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <!-- ဖုန်းစခရင်အရွယ်အစားအလိုက် အလိုအလျောက် ချိန်ညှိပေးမည့် Responsive Viewport Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Military Unit System{% endblock %}</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar အပိုင်း -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-1 px-2">
        <div class="container-fluid">
            <!-- Home Icon -->
            <a href="{% url 'unit_list' %}" class="btn" style="background-color: transparent; border: none; padding: 4px 8px;" title="ပင်မစာမျက်နှာ">
                <i class="bi bi-house" style="font-size: 24px; color: #ffffff;"></i>
            </a>

            <a class="navbar-brand ms-2" href="#">Military System</a>

            <!-- Menu Toggler Icon (ဖုန်းအတွက် Menu ဖွင့်ပိတ်ရန်) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" style="background-color: transparent !important; border: none !important; box-shadow: none !important; padding: 4px 8px;">
                <span class="navbar-toggler-icon" style="width: 28px; height: 28px;"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    {% if user.is_authenticated %}
                        <!-- User Icon (နှိပ်ရင် Profile စာမျက်နှာသို့ သွားမည်) -->
                        <li class="nav-item">
                            <a class="nav-link px-2" href="{% url 'profile_edit' %}" title="Profile Settings">
                                <i class="bi bi-person-circle" style="font-size: 24px; color: #ffffff;"></i>
                            </a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">ဝင်ရန် (Login)</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- စာမျက်နှာအလိုက် ပြောင်းလဲမည့် Content များ ဝင်မည့်နေရာ -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer အပိုင်း (အောက်ဆုံးတွင် သပ်ရပ်စွာ ပေါ်နေမည်) -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 Military Unit Management System. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
